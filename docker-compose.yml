# Two ways to run tracehound.
#
#   docker compose up demo     replay the bundled synthetic capture (no privileges)
#   docker compose up sensor   capture live from the host network (needs NET_RAW)
#
# The demo service is the default because it needs nothing from the host and
# produces detections immediately.

services:
  demo:
    build:
      context: .
      args:
        VERSION: compose
    image: tracehound:latest
    ports:
      - "8080:8080"
    # A wildcard bind is required here and is safe here: a published port
    # reaches the container's own interface, not loopback, and this service
    # only ever replays the synthetic capture baked into the image.
    command: ["replay", "/demo.pcap", "-listen", ":8080", "-speed", "120"]
    restart: "no"

  sensor:
    build:
      context: .
    image: tracehound:latest
    # Host networking is required to see the host's traffic at all; a bridged
    # container only ever sees its own.
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      # NET_RAW opens the AF_PACKET socket, NET_ADMIN sets promiscuous mode.
      # Nothing else is needed — notably not root.
      - NET_RAW
      - NET_ADMIN
    # Loopback, not ":8080". Host networking means a wildcard bind here puts
    # the unauthenticated dashboard on every interface of the machine being
    # monitored, where anyone on that network can watch their own activity
    # being detected. Loopback is still reachable from the host itself, which
    # is where an operator is. See SECURITY.md.
    command: ["sniff", "-i", "eth0", "-listen", "127.0.0.1:8080"]
    profiles: ["live"]
    restart: unless-stopped
