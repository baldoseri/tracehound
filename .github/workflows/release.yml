name: release

# Cutting a release was a manual sequence: cross-compile five targets, assemble
# archives, checksum them, upload. Done by hand it is a set of steps that will
# eventually be performed slightly differently, and the difference will be in a
# published artifact that people verify against a checksum file.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for re-running a failed release"
        required: true

permissions:
  contents: write # required to create the release; the rest of CI stays read-only

env:
  GO_VERSION: "1.26"

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # tags, so the binary can describe itself

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The tag is the version. Nothing else decides it, so an archive named
      # v0.4.1 cannot contain a binary that reports something else.
      - name: resolve version
        id: v
        run: echo "version=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Publishing a broken build is worse than publishing late, and the tag may
      # point at a commit that never went through a pull request.
      - name: test before shipping
        run: |
          go vet ./...
          go test ./... -count=1

      - name: build archives
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist

          build() {
            local goos="$1" goarch="$2" ext="${3:-}"
            local stage; stage=$(mktemp -d)

            echo "  $goos/$goarch"
            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$stage/tracehound${ext}" ./cmd/tracehound

            cp README.md LICENSE "$stage/"

            local name="tracehound-${VERSION}-${goos}-${goarch}"
            if [ "$goos" = "windows" ]; then
              ( cd "$stage" && zip -q "${name}.zip" tracehound.exe README.md LICENSE )
              mv "$stage/${name}.zip" dist/
            else
              tar czf "dist/${name}.tar.gz" -C "$stage" tracehound README.md LICENSE
            fi
            rm -rf "$stage"
          }

          build linux   amd64
          build linux   arm64
          build darwin  amd64
          build darwin  arm64
          build windows amd64 .exe

          cd dist
          sha256sum ./* | sed 's#\./##' > SHA256SUMS.txt
          ls -1sh
          cat SHA256SUMS.txt

      # The archive is what people download, so the check runs against the
      # unpacked archive rather than the build directory.
      - name: verify the shipped binary
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt

          tmp=$(mktemp -d)
          tar xzf "tracehound-${VERSION}-linux-amd64.tar.gz" -C "$tmp"
          cd "$tmp"

          got=$(./tracehound version)
          echo "reports: $got"
          [ "$got" = "tracehound ${VERSION}" ] || {
            echo "::error::archive reports '$got', expected 'tracehound ${VERSION}'"
            exit 1
          }

          # End to end on the shipped artifact: generate the capture, analyse
          # it, and require every planted behaviour to come back out. A release
          # that cannot detect anything is the failure worth catching here.
          ./tracehound gen-demo demo.pcap
          ./tracehound replay demo.pcap -min-severity medium > findings.txt
          for rule in TH-0001 TH-0002 TH-0003 TH-0004 TH-0005 TH-0007; do
            grep -q "$rule" findings.txt || {
              echo "::error::$rule did not fire in the release build"
              exit 1
            }
          done
          echo "all planted behaviours detected by the shipped binary"

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: tracehound ${{ steps.v.outputs.version }}
          draft: true # notes are written by hand; publishing is the last human step
          generate_release_notes: true
          files: dist/*
